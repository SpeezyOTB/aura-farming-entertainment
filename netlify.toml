[build]
  command = "pnpm run build"
  publish = "dist/public"

# Dragon Fist X game aliases — retain compatibility while keeping gameplay on this site
[[redirects]]
  from = "/game"
  to = "/dragonfistx"
  status = 301
  force = true

[[redirects]]
  from = "/games/dragonfistx"
  to = "/dragonfistx"
  status = 301
  force = true

[[redirects]]
  from = "/dfx/demo"
  to = "/dragonfistx"
  status = 301
  force = true

# SPA routing — serve index.html for all other routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
