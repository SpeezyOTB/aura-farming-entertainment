[build]
  command = "pnpm run build"
  publish = "dist/public"

# Dragon Fist X game redirects — all paths go straight to the original game
[[redirects]]
  from = "/game"
  to = "https://fightergame-j95rkwu8.manus.space"
  status = 302
  force = true

[[redirects]]
  from = "/games/dragonfistx"
  to = "https://fightergame-j95rkwu8.manus.space"
  status = 302
  force = true

[[redirects]]
  from = "/dragonfistx"
  to = "https://fightergame-j95rkwu8.manus.space"
  status = 302
  force = true

[[redirects]]
  from = "/dfx"
  to = "https://fightergame-j95rkwu8.manus.space"
  status = 302
  force = true

# SPA routing — serve index.html for all other routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
